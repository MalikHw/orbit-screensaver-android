plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def admobAppId = localProperties.getProperty('ADMOB_APP_ID') ?: "ca-app-pub-3940256099942544~3347511713"
def admobBannerBottom = localProperties.getProperty('ADMOB_BANNER_BOTTOM') ?: "ca-app-pub-3940256099942544/6300978111"
def admobInterstitial = localProperties.getProperty('ADMOB_INTERSTITIAL') ?: "ca-app-pub-3940256099942544/1033173712"

android {
    namespace 'com.malikhw.orbit'
    compileSdk 34

    defaultConfig {
        applicationId "com.malikhw.orbit"
        minSdk 21
        targetSdk 37
        versionCode 82
        versionName "20260921-140815"

        manifestPlaceholders = [ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"]

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
        ndkVersion "28.0.12433566"
    }

    flavorDimensions "distribution"

    productFlavors {
        full {
            dimension "distribution"
            buildConfigField "boolean", "ENABLE_UPDATER", "true"
            buildConfigField "boolean", "ENABLE_DONATE",  "false"
            manifestPlaceholders = [ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"]
            buildConfigField "String", "ADMOB_BANNER_BOTTOM", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"ca-app-pub-3940256099942544/1033173712\""
        }
        playstore {
            dimension "distribution"
            buildConfigField "boolean", "ENABLE_UPDATER", "false"
            buildConfigField "boolean", "ENABLE_DONATE", "true"
            applicationIdSuffix ".mc"
            manifestPlaceholders = [ADMOB_APP_ID: admobAppId]
            buildConfigField "String", "ADMOB_BANNER_BOTTOM", "\"${admobBannerBottom}\""
            buildConfigField "String", "ADMOB_INTERSTITIAL", "\"${admobInterstitial}\""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Coroutines for update checker
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil for image loading in settings preview
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Google Mobile Ads (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Google play billing (donate button, Play Store variant only)
    playstoreImplementation 'com.android.billingclient:billing-ktx:8.0.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}