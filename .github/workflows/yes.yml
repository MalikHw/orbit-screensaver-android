name: Generate gradlew

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate gradlew
        run: gradle wrapper --gradle-version 8.4

      - name: Commit gradlew and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradle/wrapper/ .gitignore
          git rm .github/workflows/yes.yml
          git commit -m "fix: add gradle-wrapper.jar and unignore it"
          git push